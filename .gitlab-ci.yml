image: python:3.12

cache:
  paths:
    - .cache/pip
    - .venv

variables:
  # Esto soluciona los problemas de importación indicando que la raíz del código es 'src'
  PYTHONPATH: "src"

before_script:
  - pip install poetry==2.0.0
  - poetry config virtualenvs.in-project true
  - poetry install

stages:
  - test

# Este trabajo ejecutará pytest automáticamente en cada push o Merge Request
ejecutar_tests:
  stage: test
  script:
    - poetry run pytest --maxfail=1 --disable-warnings -v