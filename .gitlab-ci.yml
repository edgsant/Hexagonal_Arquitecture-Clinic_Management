image: python:3.12

cache:
  paths:
    - .cache/pip
    - .venv

variables:
  PYTHONPATH: "src"

before_script:
  - pip install poetry==2.0.0
  - poetry config virtualenvs.in-project true
  - poetry install

stages:
  - test

ejecutar_tests:
  stage: test
  script:
    - poetry run pytest --maxfail=1 --disable-warnings -v